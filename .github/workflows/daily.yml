name: Daily Kampallur Poster
on:
  schedule:
    - cron: "30 16 * * *"   # 20:30 Asia/Dubai, renders TOMORROW's poster
  workflow_dispatch:
    inputs:
      date:
        description: "DD-MM-YYYY (blank = tomorrow, Dubai)"
        required: false
permissions:
  contents: write
env:
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fonts
        run: for w in 600 700 800; do cat fonts/parts/Anek$w.part* > fonts/Anek$w.ttf; done
      - name: Install
        run: cd tools && npm install --no-audit --no-fund
      - name: Render
        run: |
          D="${{ github.event.inputs.date }}"; [ -z "$D" ] && D=$(TZ=Asia/Dubai date -d tomorrow +%d-%m-%Y)
          mkdir -p out && node render_today.js "$D"
      - name: Save poster
        run: |
          mkdir -p posters
          find posters -name '*.png' -mtime +14 -delete || true
          cp out/*.png posters/
          cp out/*.png posters/latest.png
          git config user.name "poster-bot"
          git config user.email "poster-bot@users.noreply.github.com"
          git add -A posters
          git commit -m "Poster $(basename out/*.png)" || echo "nothing new"
          git push
      - name: Email poster
        if: ${{ env.GMAIL_APP_PASSWORD != '' }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          F=$(ls out/*.png | head -1); D=$(basename "$F" | sed -E 's/Poster_(.*)_UltraHD.png/\1/')
          python3 - "$F" "$D" <<'PY'
          import os,sys,smtplib
          from email.message import EmailMessage
          f,d=sys.argv[1],sys.argv[2]
          m=EmailMessage(); m['From']='rrksharjah@gmail.com'; m['To']='rajeeshraveendrakamballur@gmail.com'
          m['Subject']=f'കമ്പല്ലൂർ പഞ്ചാംഗം {d}'; m.set_content(f'{d} ലെ പഞ്ചാംഗം പോസ്റ്റർ.')
          m.add_attachment(open(f,'rb').read(),maintype='image',subtype='png',filename=os.path.basename(f))
          with smtplib.SMTP_SSL('smtp.gmail.com',465) as s:
              s.login('rrksharjah@gmail.com',os.environ['GMAIL_APP_PASSWORD']); s.send_message(m)
          print('sent',d)
          PY
      - name: WhatsApp link
        if: ${{ env.CALLMEBOT_APIKEY != '' }}
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
        run: |
          F=$(ls out/*.png | head -1); N=$(basename "$F"); D=$(echo "$N" | sed -E 's/Poster_(.*)_UltraHD.png/\1/')
          URL="https://raw.githubusercontent.com/rrksharjah-eng/kampallur-poster/main/posters/$N"
          curl -sS -G "https://api.callmebot.com/whatsapp.php" --data-urlencode "phone=$WHATSAPP_PHONE" --data-urlencode "text=$(printf '🙏 കമ്പല്ലൂർ പഞ്ചാംഗം %s\n%s' "$D" "$URL")" --data-urlencode "apikey=$CALLMEBOT_APIKEY"
      - uses: actions/upload-artifact@v4
        with:
          name: poster
          path: out/*.png
